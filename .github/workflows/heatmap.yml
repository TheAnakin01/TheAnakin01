name: Refresh contribution heatmap

on:
  schedule:
    - cron: "30 0 * * *" # every day, 00:30 UTC (6:00 IST)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/heatmap.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap.svg assets/info.svg
          git diff --cached --quiet || git commit -m "Refresh heatmap [skip ci]"
          git push
